# Example Tiamot server configuration.
#
# Copy this to server.toml and edit. Every key below is optional; the value
# shown is the default the server uses when the key is absent.
#
# Unknown keys are a hard error rather than a warning. A typo in a config key
# should stop the server, not silently leave you running a default you did not
# choose.

# Address and port to listen on.
#   "0.0.0.0:47811" — all IPv4 interfaces (public server)
#   "127.0.0.1:47811" — loopback only (singleplayer, or behind a proxy)
#   "[::]:47811" — all IPv6 interfaces
bind_addr = "0.0.0.0:47811"

# Directory holding the world database. Relative paths resolve against the
# server's working directory.
world_path = "world"

# Maximum simultaneously connected players. Must be at least 1.
max_players = 16

# Directory to load mods from, relative to the server's working directory.
#
# **On by default here, because a server with no mods has no blocks.** Absent is
# a legitimate configuration — the engine is mechanisms and the content is mods,
# so a server with none is empty rather than broken — but it is not a sensible
# first run: no blocks, no tools, no worldgen and no sounds are registered, and
# what a player joins is unbuildable air that looks like a broken build.
#
# Commented out, this file produced exactly that, and it is the file the
# README's own quick-start command names.
mods_path = "game"

# Who may use admin powers, as hex UUIDs. Empty by default, which is the right
# answer for a public server.
#
# Flight is the only power today, and it is a PERMISSION rather than a mode:
# every client can press the key and the server honours it for these players and
# nobody else. A player's UUID appears on this server's own log line when they
# join.
#
# A world you host for yourself from the client's menu makes YOU its operator
# automatically — this list is for a dedicated server.
#operators = ["9cb327465210..."]

# How far players can see, in chunks. One chunk is 16 blocks.
#
# **This is the CEILING, not the setting.** Clients ask for a radius and the
# server grants the smaller of what was asked and this — so a player may choose
# to see less, and nobody may make this server send more. A client asking for
# 255 gets this number and is told so.
#
# Interest volume grows with the SQUARE of the horizontal radius, so 16 is four
# times the streaming work of 8. Values outside 1..=32 are clamped rather than
# obeyed — a server that accepted 200 would appear to start and then fail to
# keep up in a way that looked like an engine bug.
view_distance = 8

# How far players can see vertically, in chunks. Clamped to 1..=16, and a
# ceiling on what clients may ask for exactly as the horizontal radius is.
#
# Smaller than the horizontal radius on purpose: players move horizontally far
# more than vertically, and the interesting content is a thin shell around the
# surface.
vertical_view_distance = 4

# Remote administration over loopback TCP. Absent means NO admin port is open,
# which is the right default for something carrying `stop` and `rebind`.
#
# The bind address must be loopback — the server refuses to start otherwise,
# because this protocol has no transport encryption. Tunnel over SSH for remote
# access. The token must be at least 16 characters and has no default: a default
# admin token is a published admin token.
#[rcon]
#bind_addr = "127.0.0.1:47812"
#token = "change-me-to-something-long-and-random"
