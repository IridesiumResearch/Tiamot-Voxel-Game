name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  # Platform-dependent work. Runs on every supported OS because that is the
  # whole point: the determinism gate (Task 04) compares hashes ACROSS these
  # legs, so a leg that does not run is a leg that cannot disagree.
  build:
    name: build / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      # Task 13's audio backend reaches the OS sound device through `cpal`,
      # which needs ALSA's headers to BUILD on Linux — not to run. There is no
      # sound card on a runner and none is wanted: the client opens a mixer if
      # it can and carries on silently if it cannot.
      #
      # This is not the charter rule 14 exception it looks like. That rule
      # forbids C bindings in the ASSET path, where a stranger's bytes are
      # parsed; ALSA is the operating system's audio API and decodes nothing.
      # Every byte a server sends still goes through Symphonia.
      - name: Audio build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      # Honours rust-toolchain.toml, so the pinned version is the one used.
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        # --all-targets covers tests and benches, not just the library.
        # Includes the determinism disallowed-methods lint from Task 04 onward.
        #
        # NOT --all-features, deliberately. The scripting backends
        # (vm-lua54 / vm-luajit / vm-luau) are MUTUALLY EXCLUSIVE — mlua cannot
        # link two Lua implementations into one binary — so --all-features is
        # not a stricter check here, it is an impossible configuration. The
        # non-default backends are checked explicitly in the policy job.
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      # Smoke mode only: `--test` runs each benchmark once to prove it still
      # compiles and executes, and records no timings. There is deliberately no
      # regression gate — shared CI runners have too much variance to make one
      # meaningful, and a flaky perf gate teaches people to ignore red builds.
      # Task 02b takes the real measurements, on real hardware.
      - name: Benchmarks (smoke)
        if: matrix.os == 'ubuntu-latest'
        run: cargo bench --workspace -- --test

      # Charter rule 3: the server must run where there is no display server.
      # ubuntu-latest runners have no X11 or Wayland session, so simply starting
      # it here is a real check rather than a symbolic one.
      - name: Server starts headless and exits 0 on signal
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          unset DISPLAY WAYLAND_DISPLAY
          # Build FIRST. `cargo run` compiles before it runs, so a fixed sleep
          # was really racing the compiler: a build that took longer than the
          # sleep meant SIGTERM landed on rustc and the step failed with 143.
          # Enabling a new mlua feature was enough to trigger it.
          cargo build -p server
          ./target/debug/server --config server.example.toml > server.log 2>&1 &
          server_pid=$!

          # Wait for the server to say it is listening, rather than guessing.
          # A readiness signal cannot be outrun by a slow runner.
          for _ in $(seq 1 60); do
            if grep -q "server listening" server.log; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "server exited during startup:"; cat server.log; exit 1
            fi
            sleep 1
          done
          if ! grep -q "server listening" server.log; then
            echo "server never reported listening:"; cat server.log
            kill -TERM "$server_pid" 2>/dev/null || true
            exit 1
          fi

          kill -TERM "$server_pid"
          wait "$server_pid"
          grep -q "world flushed and closed" server.log \
            || { echo "server did not flush on shutdown:"; cat server.log; exit 1; }
          echo "server exited 0 on SIGTERM with no display server"

  # Platform-independent policy gates. Deliberately NOT in the OS matrix.
  #
  # Every check here inspects the dependency graph, the source text, or the git
  # history — none of which change per runner OS. The firewall and cargo-deny
  # both evaluate ALL supported targets from a single machine, so running them
  # three times would triple the wall clock and prove nothing extra. The
  # CHANGELOG flags CI wall-clock as a live concern; this is where that starts.
  checks:
    name: policy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # check-dco.sh walks the commits under review, so it needs more than
          # a shallow clone.
          fetch-depth: 0

      # The fuzz targets link the client, which links the audio backend.
      - name: Audio build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: policy-checks

      - name: Dependency firewall (charter rule 3)
        run: ./scripts/check-dep-firewall.sh

      # The Task 02b spike's `gpu` feature pulls wgpu in for its VRAM
      # measurement. It is non-default so the matrix above never compiles a
      # renderer for a throwaway crate three times over, but the code behind it
      # still has to keep compiling — so it is type-checked once, here.
      - name: Type-check the spike's GPU feature
        run: cargo check -p subnode-spike --features gpu --all-targets

      # The two scripting backends that are not the default still have to
      # compile and lint — they exist so the VM benchmark stays re-runnable and
      # the verdict re-verifiable (docs/scripting-vm.md). Checked once here
      # rather than on all three OS legs: they are the same code.
      #
      # Their TESTS are not run in CI. Under vm-luajit the instruction-budget
      # test is compiled out because LuaJIT cannot honour it, and running the
      # rest would mean a third and fourth vendored Lua build on every push for
      # backends nothing ships.
      - name: Type-check the non-default scripting backends
        run: |
          for backend in vm-luajit vm-luau; do
            echo "::group::$backend"
            cargo clippy -p tiamot-core --lib \
              --no-default-features --features "$backend" -- -D warnings
            echo "::endgroup::"
          done

      - name: SPDX headers (charter rule 17)
        run: ./scripts/check-spdx.sh

      # Every game.* the engine registers must be in api/stubs/game.lua. The
      # stubs are what a mod author's editor reads; drift in either direction is
      # invisible to a build but very visible to them.
      - name: API stub coverage
        run: ./scripts/check-stubs.sh

      # Charter rule 14: the protocol decoder is the engine's front door, and
      # every byte through it came from a peer. A bounded smoke run on every
      # push, not a long campaign — the point is that the target still builds
      # and that an obvious regression fails fast, not to find deep bugs on CI
      # time. Deep runs happen off CI, seeded from the committed corpus.
      - name: Fuzz the protocol decoder (smoke)
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked
          cargo +nightly fuzz run proto_decode \
            --target x86_64-unknown-linux-gnu \
            -- -max_total_time=60 -rss_limit_mb=2048

      # Charter rule 14: server-pushed PNGs are hostile input, and the fuzz
      # target ships in the same task as the decoder rather than in a later
      # hardening pass. Covers the whole path — bytes, limits, resample, atlas —
      # because the interesting failures are at the seams between them.
      - name: Fuzz the texture ingest path (smoke)
        run: |
          cargo +nightly fuzz run texture_ingest \
            --target x86_64-unknown-linux-gnu \
            -- -max_total_time=60 -rss_limit_mb=2048

      # Charter rule 14 again, for Task 10's chunk-light payloads. A run-length
      # format is exactly the shape that goes wrong under hostile input — a run
      # header claiming more than a chunk, a run of zero length, a payload that
      # never terminates — so the bounds are checked before anything is written
      # and this is what proves it.
      - name: Fuzz the light payload decoder (smoke)
        run: |
          cargo +nightly fuzz run light_decode \
            --target x86_64-unknown-linux-gnu \
            -- -max_total_time=60 -rss_limit_mb=2048

      # And Task 11's fluid payloads, which are the same shape of format and the
      # same class of hazard. Kept a separate step rather than folded into the
      # one above so a failure names which decoder broke without anyone reading
      # the log.
      - name: Fuzz the fluid payload decoder (smoke)
        run: |
          cargo +nightly fuzz run fluid_decode \
            --target x86_64-unknown-linux-gnu \
            -- -max_total_time=60 -rss_limit_mb=2048

      # Task 12's glTF reader, and the largest hostile-input surface in the
      # project: a container holding a JSON document, a binary blob, and indices
      # from one into the other. The target asserts more than "it did not
      # panic" — every index in a model that LOADED has to be inside what it
      # indexes, because the next thing that touches it is a GPU.
      - name: Fuzz the glTF reader (smoke)
        run: |
          cargo +nightly fuzz run gltf_ingest \
            --target x86_64-unknown-linux-gnu \
            -- -max_total_time=60 -rss_limit_mb=2048

      # Task 13's Ogg Vorbis decoder, and the audio half of charter rule 14: a
      # client decodes sound files pushed by servers it does not trust. Lands in
      # the same task the decoder does rather than being deferred to hardening.
      #
      # Seeded with a committed `tone.ogg`, because nothing here can encode
      # Vorbis. That seed is what makes this reach the decoder rather than
      # stopping at the container parser — 3,312 edges against 930 without it.
      - name: Fuzz the Ogg decoder (smoke)
        run: |
          cargo +nightly fuzz run ogg_ingest \
            --target x86_64-unknown-linux-gnu \
            -- -max_total_time=60 -rss_limit_mb=2048

      # Task 14's dialog schema, and the largest hostile-input surface after
      # glTF: a TREE, which nests and branches. The flat representation is what
      # makes it safe to decode at all — a recursive one overflows the stack on
      # decode, on drop, and inside the very walk meant to bound its depth — and
      # this is what keeps that true.
      - name: Fuzz the dialog schema (smoke)
        run: |
          cargo +nightly fuzz run dialog_schema \
            --target x86_64-unknown-linux-gnu \
            -- -max_total_time=60 -rss_limit_mb=2048

      # **The crashing input, or the finding is only a stack trace.**
      # `fuzz/artifacts/` is gitignored, so until this existed a crash found
      # only on CI could not be reproduced without re-fuzzing locally and
      # hoping to rediscover the same input. That happened once (2026-08-20)
      # and cost more than this step will ever cost.
      #
      # `if: failure()` so it runs for whichever target above went red, and
      # every target writes into the same directory.
      - name: Keep whatever crashed a fuzz target
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 30

      # From Task 07 onward this is how every task's `game/` mods are validated.
      # It boots no world and binds no socket: a mod API that cannot be checked
      # without a running server is an API with a usability bug.
      # In RELEASE. These skip in a debug build, because a debug timing measures
      # rustc's settings rather than the mesher — so running them in the normal
      # test job would leave the Task 02b gate permanently green and useless.
      - name: Mesh timings against the Task 02b baseline
        run: cargo test -p client --release --test mesh_perf -- --nocapture

      # The screenshot smoke gate (Task 08). Runs on Mesa's lavapipe — a
      # software Vulkan implementation — because the point is to notice that
      # rendering silently broke, and that does not need a GPU.
      #
      # TIAMOT_REQUIRE_GPU turns "no adapter" from a skip into a failure. The
      # tests skip loudly on a developer machine with no Vulkan, so that
      # `cargo test` still passes there and nobody learns to ignore red; without
      # this variable a CI image that lost its driver would quietly stop testing
      # rendering and say nothing.
      #
      # The assertions are structural — sky above, world below, an edit changes
      # the picture — plus a coarse perceptual hash. Deliberately not
      # pixel-exact: no two drivers agree to the bit, and a gate that failed on
      # a filtering difference would be turned off within a week.
      # Mesa's lavapipe is a software Vulkan implementation, so the two render
      # gates below need no GPU.
      #
      # The ICD is DISCOVERED rather than named. It used to be named, as
      # `/usr/share/vulkan/icd.d/lvp_icd.x86_64.json`, and Mesa 25 dropped the
      # architecture suffix — so the path stopped resolving, the loader found
      # no drivers, and every render gate failed at once. Naming a
      # distribution's file layout in a workflow is a dependency on something
      # nobody is versioning.
      #
      # A missing driver fails the job rather than skipping the gates, for the
      # same reason TIAMOT_REQUIRE_GPU exists: a render gate that quietly stops
      # rendering is worse than no gate, because it still reports green.
      - name: Install a software Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json \
                   /usr/lib/*/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -n1)
          if [ -z "$icd" ]; then
            echo "::error::no lavapipe ICD found; the render gates cannot run"
            exit 1
          fi
          echo "found the lavapipe ICD at $icd"
          # Both names: VK_DRIVER_FILES is the current one, VK_ICD_FILENAMES the
          # older spelling still honoured by every loader in the wild.
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          VK_DRIVER_FILES="$icd" vulkaninfo --summary | grep -i "deviceName"

      - name: Screenshot smoke test (lavapipe)
        env:
          TIAMOT_REQUIRE_GPU: "1"
        run: cargo test -p client --test screenshot -- --nocapture

      # The whole client except the window: an embedded server started
      # in-process, a real QUIC join, streamed chunks meshed onto the GPU, and a
      # frame with a world in it. The window itself is a human gate; everything
      # under it is not, and this is where that line is drawn.
      - name: Client session against an embedded server (lavapipe)
        env:
          TIAMOT_REQUIRE_GPU: "1"
        run: cargo test -p client --test session -- --nocapture

      - name: Reference mods check clean
        run: cargo run -p server -- --check-mods game

      - name: DCO sign-off (charter rule 17)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./scripts/check-dco.sh "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            ./scripts/check-dco.sh "${{ github.event.before }}..${{ github.sha }}"
          fi

      - uses: EmbarkStudios/cargo-deny-action@v2
        name: Licence and advisory audit (charter rule 17)
        with:
          command: check
