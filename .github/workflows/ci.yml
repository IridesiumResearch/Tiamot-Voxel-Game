name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  # Platform-dependent work. Runs on every supported OS because that is the
  # whole point: the determinism gate (Task 04) compares hashes ACROSS these
  # legs, so a leg that does not run is a leg that cannot disagree.
  build:
    name: build / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      # Honours rust-toolchain.toml, so the pinned version is the one used.
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        # --all-targets covers tests and benches, not just the library.
        # Includes the determinism disallowed-methods lint from Task 04 onward.
        #
        # NOT --all-features, deliberately. The scripting backends
        # (vm-lua54 / vm-luajit / vm-luau) are MUTUALLY EXCLUSIVE — mlua cannot
        # link two Lua implementations into one binary — so --all-features is
        # not a stricter check here, it is an impossible configuration. The
        # non-default backends are checked explicitly in the policy job.
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      # Smoke mode only: `--test` runs each benchmark once to prove it still
      # compiles and executes, and records no timings. There is deliberately no
      # regression gate — shared CI runners have too much variance to make one
      # meaningful, and a flaky perf gate teaches people to ignore red builds.
      # Task 02b takes the real measurements, on real hardware.
      - name: Benchmarks (smoke)
        if: matrix.os == 'ubuntu-latest'
        run: cargo bench --workspace -- --test

      # Charter rule 3: the server must run where there is no display server.
      # ubuntu-latest runners have no X11 or Wayland session, so simply starting
      # it here is a real check rather than a symbolic one.
      - name: Server starts headless and exits 0 on signal
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          unset DISPLAY WAYLAND_DISPLAY
          # Build FIRST. `cargo run` compiles before it runs, so a fixed sleep
          # was really racing the compiler: a build that took longer than the
          # sleep meant SIGTERM landed on rustc and the step failed with 143.
          # Enabling a new mlua feature was enough to trigger it.
          cargo build -p server
          ./target/debug/server --config server.example.toml > server.log 2>&1 &
          server_pid=$!

          # Wait for the server to say it is listening, rather than guessing.
          # A readiness signal cannot be outrun by a slow runner.
          for _ in $(seq 1 60); do
            if grep -q "server listening" server.log; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "server exited during startup:"; cat server.log; exit 1
            fi
            sleep 1
          done
          if ! grep -q "server listening" server.log; then
            echo "server never reported listening:"; cat server.log
            kill -TERM "$server_pid" 2>/dev/null || true
            exit 1
          fi

          kill -TERM "$server_pid"
          wait "$server_pid"
          grep -q "world flushed and closed" server.log \
            || { echo "server did not flush on shutdown:"; cat server.log; exit 1; }
          echo "server exited 0 on SIGTERM with no display server"

  # Platform-independent policy gates. Deliberately NOT in the OS matrix.
  #
  # Every check here inspects the dependency graph, the source text, or the git
  # history — none of which change per runner OS. The firewall and cargo-deny
  # both evaluate ALL supported targets from a single machine, so running them
  # three times would triple the wall clock and prove nothing extra. The
  # CHANGELOG flags CI wall-clock as a live concern; this is where that starts.
  checks:
    name: policy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # check-dco.sh walks the commits under review, so it needs more than
          # a shallow clone.
          fetch-depth: 0

      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: policy-checks

      - name: Dependency firewall (charter rule 3)
        run: ./scripts/check-dep-firewall.sh

      # The Task 02b spike's `gpu` feature pulls wgpu in for its VRAM
      # measurement. It is non-default so the matrix above never compiles a
      # renderer for a throwaway crate three times over, but the code behind it
      # still has to keep compiling — so it is type-checked once, here.
      - name: Type-check the spike's GPU feature
        run: cargo check -p subnode-spike --features gpu --all-targets

      # The two scripting backends that are not the default still have to
      # compile and lint — they exist so the VM benchmark stays re-runnable and
      # the verdict re-verifiable (docs/scripting-vm.md). Checked once here
      # rather than on all three OS legs: they are the same code.
      #
      # Their TESTS are not run in CI. Under vm-luajit the instruction-budget
      # test is compiled out because LuaJIT cannot honour it, and running the
      # rest would mean a third and fourth vendored Lua build on every push for
      # backends nothing ships.
      - name: Type-check the non-default scripting backends
        run: |
          for backend in vm-luajit vm-luau; do
            echo "::group::$backend"
            cargo clippy -p tiamot-core --lib \
              --no-default-features --features "$backend" -- -D warnings
            echo "::endgroup::"
          done

      - name: SPDX headers (charter rule 17)
        run: ./scripts/check-spdx.sh

      # Every game.* the engine registers must be in api/stubs/game.lua. The
      # stubs are what a mod author's editor reads; drift in either direction is
      # invisible to a build but very visible to them.
      - name: API stub coverage
        run: ./scripts/check-stubs.sh

      # Charter rule 14: the protocol decoder is the engine's front door, and
      # every byte through it came from a peer. A bounded smoke run on every
      # push, not a long campaign — the point is that the target still builds
      # and that an obvious regression fails fast, not to find deep bugs on CI
      # time. Deep runs happen off CI, seeded from the committed corpus.
      - name: Fuzz the protocol decoder (smoke)
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked
          cargo +nightly fuzz run proto_decode \
            --target x86_64-unknown-linux-gnu \
            -- -max_total_time=60 -rss_limit_mb=2048

      # From Task 07 onward this is how every task's `game/` mods are validated.
      # It boots no world and binds no socket: a mod API that cannot be checked
      # without a running server is an API with a usability bug.
      # In RELEASE. These skip in a debug build, because a debug timing measures
      # rustc's settings rather than the mesher — so running them in the normal
      # test job would leave the Task 02b gate permanently green and useless.
      - name: Mesh timings against the Task 02b baseline
        run: cargo test -p client --release --test mesh_perf -- --nocapture

      - name: Reference mods check clean
        run: cargo run -p server -- --check-mods game

      - name: DCO sign-off (charter rule 17)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./scripts/check-dco.sh "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            ./scripts/check-dco.sh "${{ github.event.before }}..${{ github.sha }}"
          fi

      - uses: EmbarkStudios/cargo-deny-action@v2
        name: Licence and advisory audit (charter rule 17)
        with:
          command: check
