#
# Fuzz targets. Charter rule 14: every parser that touches bytes from an
# untrusted peer ships its fuzz target IN THE SAME TASK, not in a later
# hardening pass.
#
# Deliberately NOT a workspace member — cargo-fuzz needs nightly and its own
# profile, and pulling it into the workspace would make every ordinary
# `cargo build` depend on a nightly toolchain.
[package]
name = "tiamot-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tiamot-core = { path = "../crates/core", default-features = false }
client = { path = "../crates/client" }

[[bin]]
name = "proto_decode"
path = "fuzz_targets/proto_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "texture_ingest"
path = "fuzz_targets/texture_ingest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "light_decode"
path = "fuzz_targets/light_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fluid_decode"
path = "fuzz_targets/fluid_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gltf_ingest"
path = "fuzz_targets/gltf_ingest.rs"
test = false
doc = false
bench = false

[workspace]
