[package]
name = "tiamot-core"
description = "Voxel data, simulation, Lua runtime, physics, persistence, and protocol types."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# DEPENDENCY FIREWALL (charter rule 3): this crate MUST NOT depend on wgpu,
# winit, kira, egui, or any other windowing/render/input/audio crate, directly
# or transitively. Enforced by scripts/check-dep-firewall.sh in CI.
[dependencies]
bip39.workspace = true
blake3.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
mlua = { workspace = true, optional = true }
rand.workspace = true
postcard.workspace = true
rusqlite.workspace = true
semver.workspace = true
toml.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
zstd.workspace = true

[features]
default = ["script", "vm-lua54"]

# The scripting runtime. Optional so a build that only needs the voxel data
# model does not compile a Lua interpreter.
script = ["dep:mlua"]

# Backend selection. EXACTLY ONE, and they are mutually exclusive — mlua cannot
# link two Lua implementations into one binary. `docs/scripting-vm.md` records
# which is default and why.
vm-lua54 = ["script", "mlua/lua54"]
vm-luajit = ["script", "mlua/luajit"]
vm-luau = ["script", "mlua/luau"]

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
# The persistence tests reach past `WorldDb` on purpose, to write rows no
# supported API can write — a blob stamped with a future format version, which
# is the case that proves an untrusted world file is refused rather than
# guessed at.
rusqlite.workspace = true

[[bench]]
name = "voxel"
harness = false

[[bench]]
name = "persist"
harness = false

[[bench]]
name = "detgen"
harness = false

[[bench]]
name = "fluid"
harness = false

[[bench]]
name = "light"
harness = false
