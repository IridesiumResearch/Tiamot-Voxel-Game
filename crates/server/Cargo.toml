[package]
name = "server"
description = "Headless Tiamot server. The server is the game; the client is a viewer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# DEPENDENCY FIREWALL (charter rule 3): headless means headless. No GUI deps,
# no X11, no audio. This binary must build and run on a machine with no display
# server. Enforced by scripts/check-dep-firewall.sh in CI.
[dependencies]
tiamot-core.workspace = true
clap.workspace = true
ctrlc.workspace = true
quinn.workspace = true
rcgen.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zstd.workspace = true
blake3.workspace = true
getrandom.workspace = true

# The crate is a LIBRARY with a thin binary on top. Task 06 asks for a reusable
# `ServerHandle` so singleplayer can embed the server in-process; the plan
# suggested putting it in `core`, but that would drag tokio, quinn and rustls
# into the crate that is supposed to be pure data and simulation. Exposing the
# server as a library gives the client the same embedding without that.
[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time", "io-util"] }

[lib]
name = "tiamot_server"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/main.rs"
