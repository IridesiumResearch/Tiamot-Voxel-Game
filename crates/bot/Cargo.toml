[package]
name = "bot"
description = "Scripted headless client for integration tests, benchmarks, and load testing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# Headless by construction: this crate drives a real loopback server the same
# way a player would, so integration tests exercise the actual network path
# rather than a mock (charter rule 15). No GUI dependencies.
# Depends on the SERVER crate, deliberately. The bot must speak exactly the
# framing the server speaks, and a second implementation of it here could drift
# — producing tests that pass against a codec no real client uses. Sharing one
# codec means a framing bug fails the integration suite instead of hiding in it.
[dependencies]
tiamot-core.workspace = true
server.workspace = true
blake3.workspace = true
clap.workspace = true
ed25519-dalek.workspace = true
mlua.workspace = true
quinn.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
serde.workspace = true
# The connector's line protocol. Already in the tree (`crates/core` parses glTF
# with it), so this adds a dependency edge rather than a dependency.
serde_json = "1.0.151"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zstd.workspace = true

# Only the LAN test, and only to bind the discovery port the way the client
# binds it. Without `SO_REUSEADDR` a plain bind loses to whichever other test
# binary already holds that port, and the test skipped itself instead — which
# is how it went six CI runs without once running on macOS.
[dev-dependencies]
socket2.workspace = true

[lib]
name = "bot"
path = "src/lib.rs"

[[bin]]
name = "bot"
path = "src/main.rs"

# The connector: a headless client that reports what it sees as JSON lines and
# takes instructions the same way. See `src/bin/watcher.rs` for why it speaks to
# a pipe rather than to a model.
[[bin]]
name = "watcher"
path = "src/bin/watcher.rs"
