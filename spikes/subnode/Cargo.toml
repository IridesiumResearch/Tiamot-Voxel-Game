[package]
name = "subnode-spike"
description = "Task 02b risk spike: measures whether 3x3x3 sub-node resolution is affordable."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# THROWAWAY CODE. This crate exists to produce numbers for the keep /
# keep-with-limits / fallback decision in docs/subnode-verdict.md, not to be
# maintained. It is excluded from the workspace's default-members so a normal
# build never produces it.
#
# The dependency firewall (charter rule 3) does not apply here: this is neither
# `core` nor `server`, and the VRAM deliverable specifically requires a real GPU
# allocation.

[dependencies]
tiamot-core.workspace = true
clap.workspace = true
zstd.workspace = true

# Only for the VRAM measurement. Non-default so the normal build and the CI
# matrix never compile a renderer for a throwaway crate; CI type-checks it once
# on ubuntu instead.
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }

[features]
default = []
gpu = ["dep:wgpu", "dep:pollster"]
