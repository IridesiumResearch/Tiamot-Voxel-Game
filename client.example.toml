# Example Tiamot client configuration.
#
# Copy this to client.toml and edit. Every key below is optional; the value
# shown is the default the client uses when the key is absent — and a client
# with no config file at all is a valid, working singleplayer client.
#
# Unknown keys are a hard error rather than a warning, for the same reason the
# server does it: a typo in a config key should stop the client, not silently
# leave you playing with a setting you did not choose.
#
# Controls are not bindable yet — the engine owns bindings (charter rule 11) and
# the binding UI is a later task. For now:
#
#   click            grab the mouse; Escape releases it
#   W A S D          fly
#   Space / L-Shift  up and down
#   R-Shift          fly faster
#   F8               teleport 50,000 blocks out (a floating-origin check: the
#                    world does NOT follow, so anything still on screen is being
#                    drawn at that offset and should not shimmer)
#   F7               come back

# Which server to play on.
#   "embedded"          — start a server in this process and connect over
#                         loopback. This is what singleplayer is: there is
#                         exactly one simulation code path, and it is the
#                         server's (charter rule 2).
#   "127.0.0.1:47811"   — connect to a server already running.
# A hostname without a port is the usual mistake and is refused.
server = "embedded"

# The name shown to other players. A display string only: identity is your
# Ed25519 key and the UUID derived from it, and nothing — inventory, ownership,
# bans, storage — keys on this name (charter rule 13).
display_name = "player"

# World directory for an embedded server. Ignored when connecting out.
world_path = "singleplayer"

# How far to render, in chunks. One chunk is 16 blocks.
#
# Work grows with the SQUARE of this. Values outside the engine's supported
# range are clamped rather than obeyed.
#
# This is a REQUEST, not a setting the client can impose. On join the client
# asks the server for this radius and the server answers with what it is
# willing to send, capped by its own `view_distance` — so a server configured
# lower than this wins, and the fog is drawn at what was actually granted
# rather than at what was asked for. Asking for LESS is always granted, which
# is the direction that matters: this is how you make the world smaller on a
# machine that wants it smaller, on somebody else's server.
#
# In singleplayer the embedded server is started with this value, so here the
# request and the limit are the same number and you always get what you ask.
view_distance = 8

# How far to render vertically, in chunks. LARGER than the horizontal radius,
# at one and a half times it: the surface a player is looking at goes up and
# down, and a hilltop puts the valley floor a hundred blocks below them.
# Requested and capped exactly as the horizontal radius is.
vertical_view_distance = 12

# How the world is drawn. A debugging aid, not a lighting setting — see
# `lighting_mode` below for that.
#   "textured"  — atlas-textured.
#   "flat"      — no atlas sample. If the world looks right here and wrong in
#                 "textured", the problem is textures, not meshing.
#   "wireframe" — quad edges only. Needs the POLYGON_MODE_LINE device feature;
#                 adapters without it fall back to "textured" with a warning.
render_mode = "textured"

# How the world is LIT. Switchable while playing with L (or F5), so this is
# the mode the client starts in rather than the mode it stays in.
#   "simple"    — mode 1: directional face shading and ambient occlusion only.
#                 The cheapest mode, and the one the others are measured
#                 against. It allocates none of mode 3's targets.
#   "classic"   — mode 2: smooth propagated light, coloured, with distance fog.
#   "beautiful" — mode 3: mode 2 drawn into a float target and put through a
#                 post chain — lamp-lit surfaces bloom, and highlights roll off
#                 instead of clipping. Shadow maps and time-of-day grading are
#                 still to come; each pass is listed here as it lands.
lighting_mode = "classic"

# How sharp mode 3's shadows are. Switchable while playing with K.
#   "off"    — no shadow maps and none allocated. The rest of mode 3 — bloom,
#              the tonemap, the depth fog — is unaffected.
#   "low"    — 1024 texels per cascade, 12 MiB of depth across the three.
#   "medium" — 2048, 48 MiB. The default.
#   "high"   — 4096, 192 MiB. Ask for this on a card that has the memory.
# Each rung doubles the texels per side, so it is a factor of four in area.
shadow_quality = "medium"

# Wait for vertical blank. On by default: frame PACING is the metric this
# project cares about, not average frame rate (charter rule 18), and an
# unsynchronised loop trades the former for the latter.
vsync = true

# The debug overlay: frame timings, the worst-frame breakdown, memory, the
# adapter and the present mode. On by default, and also a checkbox on the
# settings screen (F1) and a key (F3).
#
# It is not a developer-only build. Charter rule 18 makes frame PACING the
# metric and calls integrated graphics best-effort, which means the people best
# placed to measure it are players on hardware nobody upstream will ever own —
# and they need the instrument. If you report a stutter, this is the readout to
# paste.
debug_overlay = true

# How large the interface is drawn: the menu, the inventory, chat, and a mod's
# HUD all scale together. Between 0.5 and 3.0; a value outside that refuses to
# load rather than being clamped, because an interface you cannot see is one you
# cannot fix from inside the game.
ui_scale = 1.25

# Whether the HUD is drawn at all — the crosshair and everything a mod's HUD
# script puts on the screen. Chat is NOT part of this and cannot be hidden.
# Also a checkbox in the pause menu (Escape).
hud_visible = true

# Vertical field of view, in degrees. Must be between 1 and 179.
fov_degrees = 70.0

# Mouse look, in radians of turn per pixel of movement.
mouse_sensitivity = 0.002

# Free-fly speed, in blocks per second. The real character controller is a
# later task; this camera flies.
fly_speed = 12.0

# Where to keep the identity key and the content cache. Absent means the
# platform data directory:
#   Linux    $XDG_DATA_HOME/tiamot, else ~/.local/share/tiamot
#   macOS    ~/Library/Application Support/tiamot
#   Windows  %APPDATA%\tiamot
#data_path = "/home/you/tiamot-data"
