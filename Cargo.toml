[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/server",
    "crates/client",
    "crates/bot",
    "spikes/subnode",
    "spikes/ecs",
]

# Spikes are throwaway measurement code, not shippable engine. They stay
# workspace members so `cargo test --workspace` keeps them honest, but they are
# excluded from the default build so `cargo build` at the root never produces
# them and a release never ships them.
default-members = [
    "crates/core",
    "crates/server",
    "crates/client",
    "crates/bot",
]

# Shared metadata. Individual crates inherit with `field.workspace = true` so
# the version and licence live in exactly one place.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-only"
repository = "https://github.com/IridesiumResearch/Tiamot-Voxel-Game"
authors = ["Iridesium"]
# This is an engine distributed as a whole, not a set of crates.io libraries.
# Saying so keeps an accidental `cargo publish` from happening and lets
# cargo-deny treat the internal path dependencies as private.
publish = false

# Single source of truth for dependency versions across the workspace.
#
# THE DEPENDENCY FIREWALL (charter rule 3) IS NOT NEGOTIABLE: `core` and
# `server` must never gain wgpu, winit, kira, or egui, directly or
# transitively. `scripts/check-dep-firewall.sh` enforces this in CI across all
# target platforms. Render, window, audio, and UI crates belong to `client`
# alone; add them under the "client-only" heading below.
[workspace.dependencies]
# `SO_REUSEADDR` on the LAN discovery port, which `std::net` has no way to
# set. Already in the tree under quinn; this makes it a direct dependency
# rather than a second copy.
socket2 = "0.6"
# --- shared ---------------------------------------------------------------
thiserror = "2.0"

# --- persistence (Task 03) ------------------------------------------------
# rusqlite `bundled` compiles SQLite from source rather than linking whatever
# the host happens to ship. A world database is the player's save file; its
# behaviour must not depend on the distro's SQLite version.
rusqlite = { version = "0.37", features = ["bundled", "blob"] }
# postcard enum variants are POSITION-encoded. Adding a variant anywhere but
# the end silently reinterprets existing data. See `persist::codec`.
postcard = { version = "1.1", features = ["alloc"] }
# zstd for chunk blobs. This is a C binding, which charter rule 14 forbids in
# the CLIENT ASSET path — decoding untrusted PNG/OGG/glTF from a server. A world
# database is the server's own file, not hostile input, so the rule does not
# reach here. If a world file ever becomes shareable, that changes and this
# needs revisiting.
zstd = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }

# --- scripting (Task 05) --------------------------------------------------
# mlua binds Lua 5.4, LuaJIT and Luau behind one API, which is what makes the
# three-way benchmark possible at all. Exactly ONE backend feature may be
# enabled at a time; they are mutually exclusive at the C level.
# `send` makes `Lua` movable between threads. It is needed, not optional: the
# simulation owns the VM and runs on its own thread, and the VM is created
# during startup on another. The feature wraps Lua access in a reentrant mutex,
# which is uncontended here because exactly one thread ever touches it.
mlua = { version = "0.11", features = ["vendored", "send"] }
# Version ranges for mod dependencies. The resolver is the only user.
semver = "1.0"

# --- identity and protocol (Task 06) --------------------------------------
# Charter rule 13. An Ed25519 secret key IS 32 bytes of entropy, so the BIP-39
# seed is the key directly — no derivation path, and no ambiguity about which
# key a recovery phrase produces.
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
# 24-word checksummed recovery phrases. The checksum is the point: a mistyped
# word fails instead of silently producing a stranger's identity.
bip39 = "2.2"
# Canonical player UUID = BLAKE3(root pubkey), and content addressing.
blake3 = "1.8"
# Handshake nonces and first-run seed generation.
rand = "0.9"
getrandom = "0.3"

# --- transport (Task 06) --------------------------------------------------
# QUIC gives us reliability, encryption, congestion control and stream
# multiplexing for free. The alternative is writing a UDP reliability layer,
# which is a year of subtle bugs to arrive somewhere worse.
quinn = "0.11"
# quinn's TLS. `ring` rather than aws-lc-rs: it builds without cmake or a C++
# toolchain, which keeps the from-source build working on a bare Windows box.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1.12"
# Self-signed server certificates. There is no CA in this model — clients pin
# the fingerprint on first connection (TOFU), so a certificate's only job is to
# carry a public key that stays the same between sessions.
rcgen = "0.14"
# quinn is async and has no sync API. Confined to the transport layer: the
# simulation thread is emphatically not async, because a tick that can yield
# in the middle is a tick whose result depends on scheduling.
tokio = { version = "1.47", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }

# --- server / bot ---------------------------------------------------------
clap = { version = "4.5", features = ["derive"] }
toml = "0.9"
ctrlc = { version = "3.4", features = ["termination"] }

# --- test and benchmark (dev-dependencies only) ---------------------------
# Charter rule 15: simulation invariants are property-tested, benchmarks use
# criterion. These are dev-dependencies, so they are outside the dependency
# firewall's `--edges normal,build` scope by design — a test harness may
# legitimately pull in more than the shipped binary does.
criterion = "0.7"
proptest = "1.8"

# --- client-only (render / window / audio / UI) ---------------------------
# Casting vertex structs to bytes for GPU upload. `derive` gives compile-time
# proof that a type has no padding and no invalid bit patterns, which is what
# makes the cast safe without `unsafe`.
bytemuck = { version = "1.23", features = ["derive"] }
# Vector and matrix maths for the renderer. Presentation only — charter rule 4's
# float subset does not reach here, and glam's SIMD paths would violate it if it
# did.
glam = "0.33"
# PNG decoding for server-pushed textures. THE image-rs decoder: no `unsafe`,
# fuzzed on OSS-Fuzz, and Chromium's PNG decoder since M139. Charter rule 14
# forbids C codec bindings anywhere in the client asset path, so this is not a
# preference — a `libpng` binding would be a rule violation.
png = "0.18"
# Nothing yet for the client itself; wgpu, winit, kira, and egui arrive in
# Tasks 08, 13, and 14. Anything listed here is forbidden to `core` and
# `server` by the firewall.
#
# wgpu appears early only because Task 02b's VRAM deliverable requires
# allocating real GPU buffers and reading back the allocation rather than
# projecting a number. It is behind the spike's non-default `gpu` feature so it
# does not enter the normal build or the CI matrix.
wgpu = "29"
pollster = "0.4"
# The window and its input. `winit` is the only cross-platform option that is
# not a whole framework, and it is what wgpu's own examples target.
#
# NOT default features, and the omission is `wayland-csd-adwaita`. That feature
# draws Wayland client-side decorations, and to do it it bundles the Ubuntu font
# — which brings `sctk-adwaita -> ab_glyph -> owned_ttf_parser -> ttf-parser`
# into the client, and with it two problems that `cargo deny` caught the day the
# client became a real dependency:
#
#   * the font is licensed `OFL-1.1 AND Ubuntu-font-1.0`, neither of which is on
#     charter rule 17's GPLv3-compatible allow-list. The Ubuntu Font Licence in
#     particular is not an FSF-recognised GPL-compatible licence, so shipping it
#     inside a GPL-3.0-only binary is a real question rather than a formality;
#   * `ttf-parser` is unmaintained (RUSTSEC-2026-0192) with no upgrade
#     available, which puts an abandoned font parser in a client that charter
#     rule 14 already treats as handling hostile input.
#
# Dropping the feature answers both at once and costs only the title bar, and
# only on Wayland compositors that do not draw one themselves. Revisit in Task
# 14 if the client wants decorations it draws itself.
# `serde` is Task 13's: key bindings persist by action id, and the input they
# name is written as `KeyCode`'s own variant — "KeyW", "Space" — rather than a
# table this repo would have to keep in step with winit's key list by hand.
winit = { version = "0.30", default-features = false, features = [
    "rwh_06",
    "x11",
    "wayland",
    "wayland-dlopen",
    "serde",
] }
# The audio backend. Its own thread and its own clock, which is the property
# that matters here: charter rule 18 cares about frame PACING, and a mixer that
# ran on the frame loop would stutter every time a chunk was remeshed.
#
# `cpal` is the only backend feature enabled — kira's default features pull in
# decoders for several formats, and this project decodes its own audio through
# Symphonia so that the caps in `client::audio::ingest` are the only way in.
kira = { version = "0.12", default-features = false, features = ["cpal"] }

# Ogg Vorbis decoding. Charter rule 14 forbids C codec bindings anywhere in the
# client asset path, and this is the reason that rule has teeth here: a client
# decodes audio pushed by servers it does not trust.
#
# Symphonia rather than lewton, which is effectively unmaintained — the task
# prompt says so and it is still true. Default features pull in every codec
# Symphonia knows; only ogg and vorbis are enabled, so nothing else is even
# compiled in, let alone reachable from a hostile file.
#
# MPL-2.0, which `deny.toml` already allows and which is GPLv3-compatible.
# `wav`/`pcm` beside ogg/vorbis so the engine can SYNTHESISE audio rather than
# commit it. A binary blob in a repo is not source (the same argument that made
# `engine:humanoid` a table of measurements rather than a committed `.glb`), and
# there is no Vorbis encoder in Rust worth carrying — but a WAV is a header and
# some samples, so a reference sound can be a function.
#
# It also closes the hole that mattered: without an encoder, nothing could prove
# this decoder ACCEPTS a good file, only that it refuses bad ones.
symphonia = { version = "0.5", default-features = false, features = [
    "ogg",
    "vorbis",
    "wav",
    "pcm",
] }

# HUD text. Immediate-mode, so there is no widget tree to keep in sync with the
# world — the HUD is written out fresh each frame from what the frame already
# knows. Task 14 builds the real UI on this.
# NOT default features, and the omission is `default_fonts`.
#
# egui's bundled fonts are `(MIT OR Apache-2.0) AND OFL-1.1 AND
# Ubuntu-font-1.0`. Both font licences are free, and the argument that a
# bundled font is aggregated with the program rather than derived from it is a
# good one — but the Ubuntu Font Licence is not FSF-recognised as
# GPL-compatible, so it is an argument rather than a fact. Charter rule 17 puts
# enforcement hygiene ahead of convenience, and a dependency whose licensing
# needs an argument will need it again at the worst possible moment.
#
# The client ships Go Mono instead, BSD-3-Clause, vendored under
# `crates/client/assets/third-party/go-font/` with its licence and the
# reasoning. See `client::app::install_fonts`.
egui = { version = "0.35", default-features = false }
egui-wgpu = "0.35"
egui-winit = { version = "0.35", default-features = false, features = ["links", "wayland", "x11"] }

# --- internal -------------------------------------------------------------
# The package is `tiamot-core`, not `core`, even though it lives in
# `crates/core` per charter rule 3. A package named `core` shadows the sysroot
# `core` crate in the extern prelude, making every `use core::...` in a
# dependent crate an E0659 ambiguity error. The directory layout the charter
# specifies is preserved; only the package name is qualified.
tiamot-core = { path = "crates/core" }
server = { path = "crates/server" }

[profile.release]
# Simulation is the hot path and it is single-crate-inlineable; the extra link
# time is worth it. `panic = "abort"` is deliberately NOT set: charter rule 14
# requires panic isolation on asset-decode workers.
lto = "thin"
codegen-units = 1

[profile.dev]
# **A debug build of this engine is not merely slower, it is unusable.** Measured
# here, `mesh_chunk` costs 2.97 ms per chunk at opt-level 0 against 0.124 ms in
# release — 24x — so a remesh budget of four chunks turns into ~12 ms of a frame
# and chunk streaming visibly hitches. That was reported from a window as a frame
# rate problem, and every headless measurement of it had been taken in release,
# where it does not exist.
#
# opt-level 1 gets that back to 0.41 ms per chunk, which is 7x for a small
# compile-time cost and without the loss of debuggability that 2 and 3 bring —
# and they measured no faster here (0.40 and 0.37 ms), so there is nothing to buy.
#
# `cargo run -p client` is a debug build, and it is what a human actually types.
# A profile that makes that command produce something worth looking at is part of
# the engine, not a developer convenience.
#
# Charter rule 4 is unaffected: Rust's float guarantees are the same at every
# optimisation level. There is no fast-math, no FMA contraction, and no
# reassociation, so a chunk generated by a debug build hashes identically to one
# generated by a release build. The determinism tests run in both.
opt-level = 1

[profile.dev.package."*"]
# Dependencies get the full treatment: they are compiled once and then cached,
# so their optimisation costs nothing per iteration, and wgpu, zstd and the
# image decoders are all hot enough to notice.
opt-level = 3
